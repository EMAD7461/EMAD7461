name: Deploy credentials portfolio

on:
  push:
    branches: [main]
    paths:
      - 'certificates/**'
      - '.github/workflows/deploy-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credentials-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard and certificates
        uses: actions/upload-pages-artifact@v4
        with:
          path: certificates
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
